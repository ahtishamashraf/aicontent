name: Security

on:
  push:
    # Feature branches are covered too: this repository's trunk was created
    # after the first branches existed, and CI that never fires is worse than
    # no CI because it looks green.
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against an unchanged dependency is
    # still noticed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip pip-audit
          # Audit the pinned set that actually ships in the images.
          pip-audit --requirement requirements.lock --strict

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret and artefact scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse committed secrets and artefacts
        run: |
          set -euo pipefail
          fail=0

          # A real .env must never be committed; .env.example is the template.
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::a .env file is committed"; fail=1
          fi

          # Model weights, databases, and build output do not belong in git.
          if git ls-files | grep -qE '\.(safetensors|bin|onnx|pt|pth|sqlite3|db)$'; then
            echo "::error::binary model or database artefacts are committed"; fail=1
          fi
          if git ls-files | grep -qE '(^|/)(node_modules|\.next|\.venv|__pycache__|htmlcov|test-results|playwright-report)/'; then
            echo "::error::build output or caches are committed"; fail=1
          fi

          # The example file must document variables without carrying real values.
          if grep -qE '^ORIGINLENS_(SECRET_KEY|RATE_LIMIT_PEPPER)=.{40,}' .env.example \
             && ! grep -qiE 'CHANGE_ME|dev_only' .env.example; then
            echo "::error::.env.example may contain a real secret"; fail=1
          fi

          exit $fail

      - name: Refuse a production-capable fake detector
        run: |
          set -euo pipefail
          # The settings layer must reject the fake backend in production. This
          # asserts the guard exists rather than trusting a comment.
          grep -q 'fake' backend/app/core/config.py
          grep -q 'refused in production' backend/app/core/config.py
          echo "production guard against the fake detector is present"

  production-posture:
    name: Production configuration refuses unsafe values
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      - name: Assert production fails closed
        run: |
          python - <<'PY'
          from app.core.config import Settings

          safe = dict(
              _env_file=None,
              environment="production",
              debug=False,
              cookie_secure=True,
              detector_backend="modernbert",
              secret_key="P" * 60,
              rate_limit_pepper="Q" * 60,
              encryption_key="c2FmZS1wcm9kdWN0aW9uLWtleS0zMi1ieXRlcy1va1g=",
              allowed_hosts="originlens.example.com",
          )

          unsafe = {
              "fake detector": {"detector_backend": "fake"},
              "debug mode": {"debug": True},
              "insecure cookies": {"cookie_secure": False},
              "placeholder secret": {"secret_key": "dev_only_change_me_placeholder_value"},
              "localhost host": {"allowed_hosts": "localhost"},
              "loosened rate limits": {"rate_limit_multiplier": 25.0},
          }

          Settings(**safe)
          print("safe production configuration accepted")

          for name, override in unsafe.items():
              try:
                  Settings(**{**safe, **override})
              except Exception:
                  print(f"refused: {name}")
              else:
                  raise SystemExit(f"production accepted an unsafe value: {name}")
          PY

      - name: Assert the fake detector cannot be built in production
        run: |
          python - <<'PY'
          from app.core.config import Settings
          from detection.registry import build_provider
          from detection.engines.base import ModelLoadError

          # Even if settings validation were bypassed, the registry refuses.
          class Forced(Settings):
              pass

          settings = Settings(_env_file=None, detector_backend="fake")
          object.__setattr__(settings, "environment", "production")
          try:
              build_provider(settings)
          except ModelLoadError as exc:
              print(f"registry refused: {exc.code}")
          else:
              raise SystemExit("the registry built a fake provider in production")
          PY
