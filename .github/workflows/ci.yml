name: CI

on:
  push:
    # Feature branches are covered too: this repository's trunk was created
    # after the first branches existed, and CI that never fires is worse than
    # no CI because it looks green.
    branches: [main, 'claude/**']
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy (strict)
        run: mypy app detection

      - name: Import and application startup
        run: python -c "from app.main import create_app; create_app()"

      - name: Unit tests
        run: pytest tests/unit -q

  backend-integration:
    name: Backend integration and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: originlens
          POSTGRES_PASSWORD: originlens
          POSTGRES_DB: originlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U originlens"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ORIGINLENS_DATABASE_URL: postgresql+psycopg://originlens:originlens@127.0.0.1:5432/originlens
      ORIGINLENS_TEST_DATABASE_URL: postgresql+psycopg://originlens:originlens@127.0.0.1:5432/originlens_it
      ORIGINLENS_ADMIN_DATABASE_URL: postgresql+psycopg://originlens:originlens@127.0.0.1:5432/postgres
      ORIGINLENS_REDIS_URL: redis://127.0.0.1:6379/0
      ORIGINLENS_DETECTOR_BACKEND: fake
      ORIGINLENS_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install from the lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      - name: Migrate an empty database
        run: alembic upgrade head

      - name: Verify the downgrade/upgrade round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify the schema matches the models
        run: |
          # An empty autogenerate diff proves the migration and the models agree.
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|alter_column)" \
               alembic/versions/drift_check_*.py; then
            echo "::error::Migrations have drifted from the models:"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm -f alembic/versions/drift_check_*.py
          echo "No drift between models and migrations."

      - name: Integration tests
        run: pytest tests/integration -q -m "not model"

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Strict type-check
        run: npm run typecheck

      - name: Component tests
        # The test script sets passWithNoTests=false, so discovering zero tests
        # fails this step rather than reporting a hollow success.
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (fake detector)
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: originlens
          POSTGRES_PASSWORD: originlens
          POSTGRES_DB: originlens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U originlens"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run end-to-end suite
        run: ./scripts/e2e-stack.sh

      # Traces and screenshots can contain submitted text. They are uploaded
      # only on failure, kept briefly, and must be reviewed before sharing.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  docker:
    name: Docker images and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the development Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate the production Compose file
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          ORIGINLENS_SECRET_KEY: ci
          ORIGINLENS_ENCRYPTION_KEY: ci
          ORIGINLENS_RATE_LIMIT_PEPPER: ci
          ORIGINLENS_ALLOWED_HOSTS: originlens.example
          ORIGINLENS_CORS_ORIGINS: https://originlens.example
          ORIGINLENS_MODEL_ID: org/model
          ORIGINLENS_SMTP_HOST: smtp.example
          ORIGINLENS_EMAIL_FROM: no-reply@originlens.example
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Assert production publishes no database ports
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          ORIGINLENS_SECRET_KEY: ci
          ORIGINLENS_ENCRYPTION_KEY: ci
          ORIGINLENS_RATE_LIMIT_PEPPER: ci
          ORIGINLENS_ALLOWED_HOSTS: originlens.example
          ORIGINLENS_CORS_ORIGINS: https://originlens.example
          ORIGINLENS_MODEL_ID: org/model
          ORIGINLENS_SMTP_HOST: smtp.example
          ORIGINLENS_EMAIL_FROM: no-reply@originlens.example
        run: |
          docker compose -f docker-compose.prod.yml config \
            | python3 -c "
          import sys, yaml
          services = yaml.safe_load(sys.stdin)['services']
          offenders = [n for n, s in services.items() if s.get('ports')]
          if offenders:
              raise SystemExit(f'production must not publish ports: {offenders}')
          print('no published ports in the production stack')
          "

      # Each backend target builds independently from the same file, so no
      # image depends on another having been built first.
      - name: Build the API image
        run: docker build --target api -t originlens-api:latest ./backend

      - name: Build the worker image
        run: docker build --target worker -t originlens-worker:latest ./backend

      - name: Build the migration image
        run: docker build --target migrate -t originlens-migrate:latest ./backend

      - name: Build the web image
        run: docker build -t originlens-web:latest ./frontend

      - name: Assert the images run as a non-root user
        run: |
          set -euo pipefail
          for image in originlens-api originlens-worker originlens-web; do
            user=$(docker run --rm --entrypoint sh "$image:latest" -c 'id -u')
            if [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            echo "$image runs as uid $user"
          done
