[project]
name = "originlens-backend"
version = "1.0.0"
description = "OriginLens — AI writing signal analysis API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "celery==5.4.0",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "charset-normalizer==3.4.1",
    "langdetect==1.0.9",
]

[project.optional-dependencies]
ml = [
    "torch==2.5.1",
    "transformers==4.48.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "types-redis==4.6.0.20241004",
    "celery-types==0.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "detection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/**" = ["E501"]
# Homoglyph and invisible-character handling is the subject of these modules,
# so the "ambiguous unicode" rules would flag the very data under test.
"detection/normalization.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_pipeline.py" = ["RUF001", "RUF002", "RUF003"]
"detection/diagnostics.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["langdetect.*", "celery.*", "docx.*", "pypdf.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires PostgreSQL and Redis",
    "model: requires real model weights",
]
