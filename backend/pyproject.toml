[project]
name = "originlens-backend"
version = "1.0.0"
description = "OriginLens — AI writing signal analysis API"
requires-python = ">=3.11"
# Lower bounds only. The exact resolved set that ships in the images is pinned
# in requirements.lock, regenerated with `make lock`. Bounds are raised when an
# advisory requires it rather than tracking latest for its own sake.
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.1",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "cryptography>=46.0.6",
    "python-multipart>=0.0.31",
    "email-validator>=2.2",
    "pypdf>=6.15",
    "python-docx>=1.1.2",
    "charset-normalizer>=3.4.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5.1",
    "transformers>=5.5",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
    "ruff>=0.14",
    "mypy>=1.18",
    "pip-audit>=2.7",
    "types-redis>=4.6",
    "celery-types>=0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "detection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/**" = ["E501"]
# Homoglyph and invisible-character handling is the subject of these modules,
# so the "ambiguous unicode" rules would flag the very data under test.
"detection/normalization.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalization.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_pipeline.py" = ["RUF001", "RUF002", "RUF003"]
"detection/diagnostics.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["langdetect.*", "celery.*", "docx.*", "pypdf.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires PostgreSQL and Redis",
    "model: requires real model weights",
]
